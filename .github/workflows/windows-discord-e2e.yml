name: Real Discord E2E (temporary, opt-in)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  real-discord:
    # Opt in only after review: the label must include the full exact PR head SHA.
    # A new commit invalidates the old label, including on synchronize.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/windows-mvp' &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, format('e2e-{0}', github.event.pull_request.head.sha))
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Publish exact application and build probe
        shell: pwsh
        run: |
          dotnet publish src/DiscordKiller.Windows/DiscordKiller.Windows.csproj -c Release -r win-x64 --self-contained true -o "$env:RUNNER_TEMP/discord-killer-e2e"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/DiscordKiller.Windows.RealDiscordProbe/DiscordKiller.Windows.RealDiscordProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified Discord and run isolated E2E
        shell: pwsh
        run: ./tests/DiscordKiller.Windows.RealDiscordProbe/run.ps1
