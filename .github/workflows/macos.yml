name: macOS build and tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test timer logic
        run: bash macos/Scripts/test.sh
      - name: Build and verify app
        run: |
          bash macos/Scripts/build-app.sh
          codesign --verify --deep --strict 'macos/dist/Discord Timer.app'
          plutil -lint 'macos/dist/Discord Timer.app/Contents/Info.plist'
          unzip -t 'macos/dist/Discord Timer.zip'
      - name: Install pinned DMG build dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-venv"
          "$RUNNER_TEMP/dmg-venv/bin/pip" install -r macos/Packaging/requirements.txt
      - name: Build and verify drag-to-Applications DMG
        env:
          DISCORD_DMG_PYTHON: ${{ runner.temp }}/dmg-venv/bin/python
        run: |
          bash macos/Scripts/build-dmg.sh
          bash macos/Scripts/test-dmg.sh
